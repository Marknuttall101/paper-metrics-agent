[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-metrics-agent"
version = "0.2.0"
description = "Multi-agent extraction and comparison of statistical results from research papers, with every number checked against its source."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Nuttall" }]
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.187,<0.3"]
keywords = ["llm", "agents", "claude", "pubmed", "meta-analysis", "evaluation", "information-extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paper-metrics = "paper_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_metrics = ["sample_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
